server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true

spring:
  application:
    name: msvc-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true        # 🔹 Permite descubrir rutas automáticamente desde Eureka
          lower-case-service-id: true  # 🔹 Usa IDs en minúsculas (coincide con tus nombres en Eureka)
