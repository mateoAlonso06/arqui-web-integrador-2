version: '3.9'

services:
  msvc-usuarios-db:
    image: mysql:8.0
    container_name: msvc-usuarios-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: msvc-usuarios
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: usuarios_user
      MYSQL_PASSWORD: usuarios_pass
    ports:
      - "3306:3306"
    volumes:
      - msvc_usuarios_mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

volumes:
  msvc_usuarios_mysql_data:
